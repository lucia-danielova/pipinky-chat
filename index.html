<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Skupinový chat s AI mediátorom." />
    <title>Pipinky Chat</title>
    <script type="module" crossorigin src="./assets/index-ByONYHKP.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-C5X8M6w9.css">
  </head>
  <body>
    <main class="app-shell">
      <section id="login-view" class="login-view" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">P</div>
        <p class="eyebrow">SPOLOČNÝ PRIESTOR</p>
        <h1 id="login-title">Pipinky Chat</h1>
        <p class="muted">Prihlás sa odkazom, ktorý ti pošleme e-mailom.</p>
        <form id="login-form" class="form-card">
          <div class="field">
            <label for="email">E-mail</label>
            <input id="email" name="email" type="email" autocomplete="email" required />
          </div>
          <p id="login-error" class="error-message" role="alert" hidden></p>
          <p id="login-success" class="success-message" role="status" hidden></p>
          <button id="login-button" class="button button-primary" type="submit">Poslať prihlasovací odkaz</button>
        </form>
        <p class="muted invite-note">Každý používateľ s potvrdeným e-mailom má prístup k celému chatu.</p>
      </section>

      <section id="chat-view" class="chat-view" aria-label="Skupinový chat" hidden>
        <header class="chat-header">
          <div>
            <p class="eyebrow">SPOLOČNÝ PRIESTOR</p>
            <h1>Pipinky Chat</h1>
            <p id="current-user" class="user-label"></p>
          </div>
          <button id="logout-button" class="button button-quiet" type="button">Odísť</button>
        </header>
        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
        <p id="chat-error" class="error-message chat-error" role="alert" hidden></p>
        <form id="message-form" class="message-form">
          <label class="sr-only" for="message-input">Napíš správu</label>
          <input id="message-input" name="message" type="text" maxlength="2000" placeholder="Napíš správu…" autocomplete="off" required />
          <button id="send-button" class="button button-primary send-button" type="submit" aria-label="Poslať správu">Poslať</button>
        </form>
        <button id="mediate-button" class="button button-mediator" type="button">
          <span aria-hidden="true">✦</span> Pomoc mediátora
        </button>
      </section>
    </main>
  </body>
</html>
