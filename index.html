<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#111827" />
    <meta name="description" content="Skupinový chat s AI mediátorom." />
    <title>Pipinky Chat</title>
    <script type="module" crossorigin src="./assets/index-B-VPD2Mx.js"></script>
    <link rel="stylesheet" crossorigin href="./assets/index-BPop05Ex.css">
  </head>
  <body>
    <main class="app-shell">
      <section id="login-view" class="login-view" aria-labelledby="login-title">
        <div class="brand-mark" aria-hidden="true">P</div>
        <p class="eyebrow">SPOLOČNÝ PRIESTOR</p>
        <h1 id="login-title">Pipinky Chat</h1>
        <p class="muted">Zadaj meno a vstúp do spoločného chatu.</p>
        <form id="login-form" class="form-card">
          <div class="field">
            <label for="display-name">Tvoje meno</label>
            <input id="display-name" name="display-name" type="text" maxlength="40" autocomplete="nickname" required />
          </div>
          <p id="login-error" class="error-message" role="alert" hidden></p>
          <button id="login-button" class="button button-primary" type="submit">Vstúpiť do chatu</button>
        </form>
        <p class="muted invite-note">Chat je verejný. Meno nie je overené a môže ho použiť ktokoľvek.</p>
      </section>

      <section id="chat-view" class="chat-view" aria-label="Skupinový chat" hidden>
        <header class="chat-header">
          <div>
            <p class="eyebrow">SPOLOČNÝ PRIESTOR</p>
            <h1>Pipinky Chat</h1>
            <p id="current-user" class="user-label"></p>
          </div>
          <button id="logout-button" class="button button-quiet" type="button">Odísť</button>
        </header>
        <details class="name-settings">
          <summary>Zmeniť meno</summary>
          <form id="name-form" class="name-form">
            <label class="sr-only" for="new-name">Nové meno</label>
            <input id="new-name" type="text" maxlength="40" autocomplete="nickname" placeholder="Nové meno" required />
            <button id="name-button" class="button button-quiet" type="submit">Uložiť</button>
          </form>
        </details>
        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>
        <p id="chat-error" class="error-message chat-error" role="alert" hidden></p>
        <form id="message-form" class="message-form">
          <label class="sr-only" for="message-input">Napíš správu</label>
          <input id="message-input" name="message" type="text" maxlength="2000" placeholder="Napíš správu…" autocomplete="off" required />
          <button id="send-button" class="button button-primary send-button" type="submit" aria-label="Poslať správu">Poslať</button>
        </form>
        <button id="mediate-button" class="button button-mediator" type="button">
          <span aria-hidden="true">✦</span> Pomoc mediátora
        </button>
      </section>
    </main>
  </body>
</html>
