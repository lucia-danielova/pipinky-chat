<!doctype html>
<html lang="sk">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover, interactive-widget=resizes-content" />
    <meta name="theme-color" content="#070b14" />
    <meta name="description" content="Skupinový chat s AI mediátorom." />
    <title>Pipinky Chat</title>
  </head>
  <body>
    <div class="ambient-glow" aria-hidden="true"></div>

    <main class="app-shell">
      <section id="login-view" class="login-view" aria-labelledby="login-title">
        <div class="login-hero">
          <div class="brand-mark" aria-hidden="true">P</div>
          <div class="status-pill">
            <span class="status-dot" aria-hidden="true"></span>
            Verejný priestor online
          </div>
          <h1 id="login-title">Pipinky Chat</h1>
          <p class="muted">Zadaj prezývku a pripoj sa do konverzácie s podporou AI mediátora.</p>
        </div>

        <form id="login-form" class="form-card">
          <div class="field">
            <label for="display-name">Tvoje meno v chate</label>
            <input
              id="display-name"
              name="display-name"
              type="text"
              maxlength="40"
              placeholder="Napr. Lucia"
              autocomplete="nickname"
              required
            />
          </div>
          <p id="login-error" class="error-message" role="alert" hidden></p>
          <button id="login-button" class="button button-primary" type="submit">
            Vstúpiť do chatu
            <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M5 12h14" />
              <path d="m12 5 7 7-7 7" />
            </svg>
          </button>
        </form>

        <p class="muted invite-note">
          Chat je otvorený. Mená sa neoverujú a môže ich použiť ktokoľvek.
        </p>
      </section>

      <section id="chat-view" class="chat-view" aria-label="Skupinový chat" hidden>
        <header class="chat-header">
          <div class="header-brand">
            <div class="brand-mark brand-mark-sm" aria-hidden="true">P</div>
            <div>
              <div class="header-title-row">
                <h1>Pipinky Chat</h1>
                <span class="live-badge">LIVE</span>
              </div>
              <div class="user-status-row">
                <span class="status-dot" aria-hidden="true"></span>
                <p id="current-user" class="user-label"></p>
              </div>
            </div>
          </div>

          <button id="logout-button" class="button button-icon" type="button" title="Odísť z chatu">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4" />
              <polyline points="16 17 21 12 16 7" />
              <line x1="21" y1="12" x2="9" y2="12" />
            </svg>
            <span>Odísť</span>
          </button>
        </header>

        <details class="name-settings">
          <summary>
            <svg width="14" height="14" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
              <path d="M17 3a2.85 2.83 0 1 1 4 4L7.5 20.5 2 22l1.5-5.5Z" />
            </svg>
            Zmeniť prezývku
          </summary>
          <form id="name-form" class="name-form">
            <label class="sr-only" for="new-name">Nové meno</label>
            <input id="new-name" type="text" maxlength="40" autocomplete="nickname" placeholder="Zadaj nové meno…" required />
            <button id="name-button" class="button button-quiet" type="submit">Uložiť</button>
          </form>
        </details>

        <div id="chat-messages" class="chat-messages" role="log" aria-live="polite" aria-relevant="additions"></div>

        <footer class="chat-dock">
          <p id="chat-error" class="error-message chat-error" role="alert" hidden></p>

          <div class="mediator-modes" role="group" aria-label="Režimy AI mediátora">
            <button type="button" class="mode-chip" data-mode="calm">🕊️ Upokojiť</button>
            <button type="button" class="mode-chip" data-mode="summary">📋 Zhrnúť</button>
            <button type="button" class="mode-chip" data-mode="compromise">🤝 Kompromis</button>
          </div>

          <form id="message-form" class="message-form">
            <label class="sr-only" for="message-input">Napíš správu</label>
            <div class="composer-box">
              <textarea
                id="message-input"
                name="message"
                rows="1"
                maxlength="2000"
                placeholder="Napíš správu alebo @mediator…"
                required
              ></textarea>
              <button id="send-button" class="button button-primary send-button" type="submit" aria-label="Poslať správu">
                <svg width="18" height="18" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round" aria-hidden="true">
                  <line x1="22" y1="2" x2="11" y2="13" />
                  <polygon points="22 2 15 22 11 13 2 9 22 2" />
                </svg>
              </button>
            </div>
          </form>

          <button id="mediate-button" class="button button-mediator" type="button">
            <svg width="16" height="16" viewBox="0 0 24 24" fill="currentColor" aria-hidden="true">
              <path d="M12 2L14.4 9.6L22 12L14.4 14.4L12 22L9.6 14.4L2 12L9.6 9.6L12 2Z" />
            </svg>
            <span class="mediator-label">Pomoc AI mediátora</span>
          </button>
        </footer>
      </section>
    </main>

    <script type="module" src="/src/main.js"></script>
  </body>
</html>
