name: Build Android APK

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 21
      - run: npm ci
      - name: Build and sync web assets
        run: |
          test -n "$VITE_SUPABASE_ANON_KEY" || { echo "Missing PIPINKY_SUPABASE_PUBLISHABLE_KEY secret"; exit 1; }
          npm run android:sync
        env:
          VITE_SUPABASE_URL: https://ldjkfobspnmripeipboc.supabase.co
          VITE_SUPABASE_ANON_KEY: ${{ secrets.PIPINKY_SUPABASE_PUBLISHABLE_KEY }}
      - name: Build debug APK
        working-directory: android
        run: bash gradlew assembleDebug
      - uses: actions/upload-artifact@v4
        with:
          name: pipinky-chat-android-debug
          path: android/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
